services:
  server:
    image: ghcr.io/andyg-0/conduit:${CONDUIT_VERSION:-latest}
    build: .
    restart: unless-stopped
    volumes:
      - conduit-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  conduit-data:
  caddy-data:
  caddy-config:
