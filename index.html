<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conduit</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header id="tile-banner" class="tile-banner">
      <div class="tile-banner-art">
        <img class="tile-banner-backdrop" alt="" hidden />
      </div>
      <div class="tile-banner-scrim"></div>
      <div class="tile-banner-content">
        <span class="tile-banner-icon"></span>
        <span class="tile-banner-name"></span>
        <p class="tile-banner-trending" hidden></p>
      </div>
    </header>
    <main id="grid" class="grid"></main>
    <section id="settings" class="settings" hidden></section>
    <section id="help" class="help" hidden></section>
    <section id="screensaver" class="screensaver" hidden>
      <video id="screensaver-video" autoplay muted playsinline></video>
    </section>
  </body>
</html>
