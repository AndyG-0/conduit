name: Release

# Builds macOS (.app/.dmg) and Windows (.msi/NSIS .exe) bundles on a `v*` tag
# and publishes them together as one GitHub Release. Neither is really
# signed — real notarization needs a paid Apple Developer ID, and real
# Windows signing needs a code-signing certificate, neither of which this
# project has yet — so the release body warns about Gatekeeper's and
# SmartScreen's first-launch blocks.
#
# The build jobs only upload workflow artifacts; a single `publish` job
# creates the release once both have finished, rather than both build jobs
# racing to create/update the same release.
#
# It can also be run by hand (Actions > Release > Run workflow) on any
# branch to build both platforms' installers as downloadable workflow
# artifacts without tagging; `publish` only runs for a `v*` tag.
#
# `build-docker` publishes the self-hosted PWA image (server/+web/, see
# Dockerfile) to GHCR for amd64 and arm64. It also runs on a manual
# workflow_dispatch to validate the multi-arch build, but only pushes to
# the registry on an actual `v*` tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (unsigned)
        run: pnpm tauri build
        env:
          # Empty signing identity = ad-hoc signing, not a real Developer ID.
          APPLE_SIGNING_IDENTITY: "-"

      - name: Zip .app bundle
        run: |
          # A manual run's ref is a branch name, which can contain "/".
          ref="${GITHUB_REF_NAME//\//-}"
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent *.app \
            "Conduit-${ref}-macos.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/macos/*.app.zip
            src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (unsigned)
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        # GHCR requires an all-lowercase path; github.repository preserves
        # the repo's actual case (AndyG-0/conduit).
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        # Authenticated pulls get a much higher rate limit than anonymous
        # ones; setup-qemu-action pulls its binfmt image from Docker Hub
        # and anonymous pulls there are prone to "toomanyrequests" errors.
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract changelog section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; if ($0 ~ "\\[" ver "\\]") { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "_No changelog entry found for $version._" > release-notes.md
          fi

      - name: Build release body
        run: |
          {
            echo "**These builds are unsigned.**"
            echo
            echo "- **macOS** (ad-hoc signed): Gatekeeper will block the app on"
            echo "  first launch. Right-click (Control-click) the app and choose"
            echo "  **Open**, then confirm, to run it the first time."
            echo "- **Windows**: SmartScreen may warn about an unrecognized app"
            echo "  when running the installer. Click **More info**, then"
            echo "  **Run anyway**."
            echo
            cat release-notes.md
          } > full-release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Conduit ${{ github.ref_name }}"
          body_path: full-release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/macos/**/*.app.zip
            artifacts/macos/**/*.dmg
            artifacts/windows/**/*.msi
            artifacts/windows/**/*.exe
